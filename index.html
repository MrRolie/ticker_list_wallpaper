<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Street Price Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Ticker Table -->
    <table id="board">
        <thead>
            <tr>
                <th class="col-symbol">Symbol</th>
                <th class="col-price">Price</th>
                <th class="col-change">Change</th>
                <th class="col-percent">% Change</th>
                <th class="col-pct5d">% 5d</th>
                <th class="col-pct30d">% 30d</th>
                <th class="col-volume">Volume</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Stats Ribbon (moved to bottom) -->
    <div id="stats-ribbon" class="hidden">
        <div id="top-performers" class="ribbon-line"></div>
    </div>

    <script src="board.js"></script>
</body>
</html>
